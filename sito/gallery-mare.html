  <div id="slider-counter" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 text-sale text-[11px] tracking-widest" style="text-shadow:0 1px 6px rgba(0,0,0,0.5);"></div>

<script>
(function () {
  var container = document.getElementById('gallery-slider');
  if (!container) { return; }
  var slides = container.getElementsByClassName('slider-slide');
  var current = 0;
  var timer = null;
  var counter = document.getElementById('slider-counter');
  var prevBtn = document.getElementById('slider-prev');
  var nextBtn = document.getElementById('slider-next');

  if (slides.length < 2) {
    if (counter) { counter.style.display = 'none'; }
    if (prevBtn) { prevBtn.style.display = 'none'; }
    if (nextBtn) { nextBtn.style.display = 'none'; }
    return;
  }

  function updateCounter() {
    if (counter) { counter.textContent = (current + 1) + ' / ' + slides.length; }
  }
  function goTo(index) {
    var next = ((index % slides.length) + slides.length) % slides.length;
    slides[current].style.opacity = '0';
    slides[next].style.opacity = '1';
    current = next;
    updateCounter();
  }
  function startAuto() {
    if (timer) { clearInterval(timer); }
    timer = setInterval(function () { goTo(current + 1); }, 4500);
  }

  window.sliderNav = function (delta) {
    goTo(current + delta);
    startAuto();
  };

  for (var i = 0; i < slides.length; i++) { slides[i].style.transition = 'opacity 1.2s ease'; }
  updateCounter();
  startAuto();

  var touchStartX = null;
  container.addEventListener('touchstart', function (e) { touchStartX = e.touches[0].clientX; });
  container.addEventListener('touchend', function (e) {
    if (touchStartX === null) { return; }
    var dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 40) { sliderNav(dx < 0 ? 1 : -1); }
    touchStartX = null;
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { sliderNav(1); }
    if (e.key === 'ArrowLeft') { sliderNav(-1); }
  });
})();
</script>
