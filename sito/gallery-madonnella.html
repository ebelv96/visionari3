<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa dei Visionari &middot; Madonnella &middot; Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Questrial&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { crema: '#f9f7f2', argilla: '#c5a18b', mare: '#8ba9b3', fumo: '#3e3b39', sale: '#ffffff' },
        fontFamily: {
          display: ['Cormorant Garamond', 'ui-serif', 'Georgia', 'serif'],
          sans: ['Questrial', 'ui-sans-serif', 'system-ui', 'sans-serif']
        }
      }
    }
  };
</script>
<style> body { margin:0; background:#1c1a18; } </style>
</head>
<body class="font-sans">

  <a href="index.html" class="fixed top-6 left-6 z-50 text-sale text-[11px] uppercase tracking-widest px-4 py-2 border border-sale/40 hover:bg-sale hover:text-fumo transition-colors" style="text-shadow:0 1px 6px rgba(0,0,0,0.4);">&larr; Torna al sito</a>

  <div class="absolute top-8 left-0 w-full text-center z-10" style="text-shadow:0 1px 8px rgba(0,0,0,0.6);">
    <span class="text-[10px] uppercase tracking-[0.3em] text-sale/80">Casa dei Visionari &middot; Madonnella</span>
  </div>

  <div class="relative w-full h-screen overflow-hidden crossfade-slider" id="gallery-slider">
    <img src="images/mad.jpeg" class="slider-slide absolute inset-0 w-full h-full object-cover" style="opacity:1;">
  </div>

<script>
(function () {
  function initSlider(container) {
    var slides = container.getElementsByClassName('slider-slide');
    if (slides.length < 2) { return; }
    var current = 0;
    for (var i = 0; i < slides.length; i++) {
      slides[i].style.transition = 'opacity 1.8s ease';
    }
    setInterval(function () {
      var next = (current + 1) % slides.length;
      slides[current].style.opacity = '0';
      slides[next].style.opacity = '1';
      current = next;
    }, 4500);
  }
  var containers = document.getElementsByClassName('crossfade-slider');
  for (var c = 0; c < containers.length; c++) { initSlider(containers[c]); }
})();
</script>

</body>
</html>
